<!-- DEMO SCENE -->

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    
    <!-- Warning message about large data consumption - first thing on page load -->
    <script>
      if (!localStorage.getItem("accepted")) {
        const ok = confirm("UPOZORNĚNÍ:\n\nTato verze aplikace je datově náročná.\nKaždé načtení stránky může přenést až ~200 MB dat.");
        localStorage.setItem("accepted", "true");
      }
    </script>

    <!-- DEBUG - model loading -->
    <script>
      let i = 0;
      window.addEventListener('model-loaded', () => {
        console.log(i, `: model loaded in ${performance.now()} ms`);
        i = i +1;
      });
    </script>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="static/js/utils.js"></script>
    <script src="static/js/textToSpeech.js"></script>

    <!-- override files -->
    <script src="static/js/buildingsOverride.js"></script>
    <script src="static/js/infographicsOverride.js"></script>
    <script src="static/js/mobileMovement/checkpointOverride.js"></script>

    <!-- mapping function -->
    <script src="static/js/assetLoader.js"></script>

    <!-- cursor -->
    <script src="static/js/cursors.js"></script>

    <!-- teleportation -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
    
    <!-- controllers for generating entities -->
    <script src="static/js/buildings_controller.js"></script>
    <script src="static/js/mobileMovement/directionArrows.js"></script>
    <script src="static/js/infographics_controllers.js"></script>
    
    <!-- movement-controls component -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    
    <!-- main scene - with controllers -->
    <a-scene infographics-controller checkpoint-controller stats>
      <!-- preloading textures and sounds -->
      <a-assets>
        <img id="cloud_background" src="{{ url_for('static', filename='textures/sky-clouds-background.png') }}">
        <img id="ground_texture" src="{{ url_for('static', filename='textures/cobblestone_floor.png') }}">
        <!-- <img id="ground_texture_map" src="{{ url_for('static', filename='textures/cobblestone_floor_map.png') }}"> -->
        <audio id="ambianceSound" src="{{ url_for('static', filename='sounds/ambiance.mp3') }}" preload="auto"></audio>
        <a-asset-item id="sign" src="static/models/interactive_kiosk.glb"></a-asset-item>
    </a-assets>
      
      <!-- Player representataion - camera & VR controllers -->
      <a-entity id="rig" fix-teleport-offset movement-controls="controls: gamepad,nipple" nipple-controls="mode: static">
        <!-- camera entiy with external and custom cursors -->
        <a-entity
          id="camera"
          position="0 1.6 0"
          camera="near: 0.1; far: 1000"
          look-controls
          wasd-controls
          mouse-cursor
          fuse-cursor
        ></a-entity>
        <!-- left hand controller used for movement -->
        <a-entity id="left-hand" meta-touch-controls="hand: left" raycaster="" blink-controls="cameraRig: #rig; button: trigger; rotateOnTeleport: false; curveShootingSpeed: 12; collisionEntities: #ground;"></a-entity>
        <!-- right hand controller used for interaction-->
        <a-entity id="right-hand" meta-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable, .gazeable; far: 5"></a-entity>
      </a-entity>

      <!-- ambiance sounds -->
      <a-entity sound="src: #ambianceSound; autoplay: true; loop: true; volume:15;" position="-4 3 -45"></a-entity>  
      
      <!-- DEBUG ENTITY - toggle fuse-cursor on click -->
      <a-cylinder toggle-fuse-cursor color="black" position="21 0.25 -40" radius="0.3" height="0.5" class="clickable">
        <a-entity 
          text="value: Gaze Cursor Toggle; align: center; color: #000000; width: 5"
          position="0 1 0">
        </a-entity>
      </a-cylinder>

        <!-- Skybox -->
        <a-sky src="#cloud_background"></a-sky>
        
        <!-- Ground plane -->
        <a-plane
            id="ground"
            rotation="-90 61 0"
            width="300"
            height="300"
            material="
                src: #ground_texture;
                repeat: 150 150;
                roughness: 1;
                metalness: 0;
        ">
        </a-plane>

        <!-- Normal mapped ground texture - more perf. intensive -->
        <!--a-plane 
            id="ground"
            rotation="-90 0 0"
            width="100"
            height="100"
            material="
                src: #ground_texture;
                normalMap: #ground_texture_map;
                repeat: 50 50;
                roughness: 1;
                metalness: 0;
        ">
        </a-plane-->
      
    </a-scene>
  </body>
</html>
